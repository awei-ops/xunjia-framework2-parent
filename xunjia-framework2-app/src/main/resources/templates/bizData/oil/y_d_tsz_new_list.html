<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:xunjia="http://www.thymeleaf.org">

<head>
    <div th:replace="framework/include/head::head"></div>
    <script type="text/javascript" src="/global/js/echarts/echarts.min.js"></script>
</head>

<body>
    <div class="easyui-layout" fit="true">
        <div data-options="region:'north',height:53" style="padding:10px 8px 10px 8px;overflow:hidden;">
            <a>站名称：</a>
            <select class="easyui-combobox" id="query-stations" data-options="
                url:'/dmgc_y_tsz_new/getAll',
                width: 150,
                textField: 'mc',
                valueField: 'eventId',
                editable: true,
                loadFilter : function (data) {
                  if (data) {
                      data.splice(0, 0, {mc: '全部', eventId: ''});
                  }
                  return data;
              },
            ">
            </select>
            <input id="query-startDate-key" class="easyui-datebox" editable="false" value="true"
                data-options="width:240,label:'生产日期：' ,labelAlign:'right',labelWidth:90" />
            <!-- <input id="query-endDate-key" class="easyui-datebox" editable="false" value="true"
                data-options="width:240,label:'结束时间：' ,labelAlign:'right',labelWidth:90" /> -->
            <a href="javascript:" onclick="searchPageData();" class="easyui-linkbutton" iconCls="fa fa-search">查询</a>
            <a href="javascript:" onclick="importData();" class="easyui-linkbutton"
                iconCls="fa fa-cloud-upload">同步数据</a>
            <a href="javascript:" onclick="auditData();" class="easyui-linkbutton" iconCls="fa fa-search">审核并考核</a>
            <a href="javascript:" onclick="exportData();" class="easyui-linkbutton"
                iconCls="fa fa-cloud-download">导出</a>
        </div>
        <div data-options="region:'center'">
            <table id="display-data-table"></table>
            <div id="user-operation-bar" class="datagrid-toolbar">
                <xunjia:button th:menu-id="${menuId}" perm-code="dmgc_s_d_zszrsj:export" />
            </div>
        </div>
    </div>

    <script th:inline="none">
        $(function () {
            $("#display-data-table").datagrid({
                url: '/dmgc_y_d_tsz_new/getPageData',
                fit: true,
                fitColumns: false,
                striped: true,
                loadMsg: '数据加载中，请稍候...',
                pagination: true,
                pageSize: 20,
                rownumbers: true,
                onClickCell: onClickCell,
                onAfterEdit: onAfterEdit,
                toolbar: "#user-operation-bar",
                queryParams: {
                    startDate: $("#query-startDate-key").datebox('getValue'),
                    endDate: $("#query-startDate-key").datebox('getValue')
                },
                columns: [[
                    { "field": "rq", "title": "日期", "width": 110 },
                    { "field": "stationName", "title": "所属站", width: 110 },
                    {
                        "field": "zhdh", "title": "综合单耗(kWh/t)", "width": 110, styler: flagColor,
                        editor: {
                            type: 'numberbox',
                            options: { precision: 2 }
                        }
                    },
                    {
                        "field": "dyohd", "title": "吨油耗电(kWh/t)", "width": 110, styler: flagColor,
                        editor: {
                            type: 'numberbox',
                            options: { precision: 2 }
                        }
                    },
                    {
                        "field": "dyohq", "title": "吨油耗气(M3/t)", "width": 110, styler: flagColor,
                        editor: {
                            type: 'numberbox',
                            options: { precision: 2 }
                        }
                    },
                    {
                        "field": "dyehd", "title": "吨液耗电(kWh/t)", "width": 110, styler: flagColor,
                        editor: {
                            type: 'numberbox',
                            options: { precision: 2 }
                        }
                    },
                    {
                        "field": "dyehq", "title": "吨液耗气(M3/t)", "width": 110, styler: flagColor,
                        editor: {
                            type: 'numberbox',
                            options: { precision: 2 }
                        }
                    },
                    // { "field": "ssdwdm", "title": "所属单位代码", "width": 110 },
                    { "field": "wqgyl", "title": "稳前供油量(t/d)", "width": 110 },
                    { "field": "whhyl", "title": "稳后供油量(t/d)", "width": 110 },
                    { "field": "wsyl", "title": "外输油量(M3/d)", "width": 110 },
                    { "field": "wsymd", "title": "外输油密度(Kg/M3)", "width": 110 },
                    { "field": "wsyzl", "title": "外输油质量(t/d)", "width": 110 },
                    { "field": "lhyhsl", "title": "老化油回收量(t/d)", "width": 110 },
                    { "field": "zhyl", "title": "自耗油量(t/d)", "width": 110 },
                    { "field": "wsyhsl", "title": "外输油含水率(%)", "width": 110 },
                    { "field": "wgwsl", "title": "外供污水量(M3)", "width": 110 },
                    { "field": "wshyl", "title": "污水含油量(mg/L)", "width": 110 },
                    { "field": "csl", "title": "掺水量(M3)", "width": 110 },
                    { "field": "csyl", "title": "掺水压力(MPa)", "width": 110 },
                    { "field": "cswd", "title": "掺水温度(℃)", "width": 110 },
                    { "field": "wsql", "title": "外输气量(M3/d)", "width": 110 },
                    { "field": "fsql", "title": "返输气量(M3/d)", "width": 110 },
                    { "field": "hql", "title": "耗气量(M3/d)", "width": 110 },
                    { "field": "wsqsfzclz", "title": "外输气是否至处理站", "width": 110 },
                    { "field": "wstrqyl", "title": "外输天然气压力(MPa)", "width": 110 },
                    { "field": "syhdl", "title": "输油耗电量(kWh/d)", "width": 110 },
                    { "field": "cshdl", "title": "掺水耗电量(kWh/d)", "width": 110 },
                    { "field": "zhhdl", "title": "综合耗电量(kWh/d)", "width": 110 },
                    { "field": "lyhgwd", "title": "来油汇管温度(℃)", "width": 110 },
                    { "field": "sywd", "title": "输油温度(℃)", "width": 110 },
                    { "field": "tswd", "title": "脱水温度(℃)", "width": 110 },
                    { "field": "syhgyl", "title": "输油汇管压力(MPa)", "width": 110 },
                    { "field": "prjyl", "title": "破乳剂用量(kg/d)", "width": 110 },
                    { "field": "zgjyl", "title": "阻垢剂用量(kg/d)", "width": 110 },
                    { "field": "jsjyl", "title": "净水剂用量(kg/d)", "width": 110 },
                    { "field": "qtyjyl", "title": "其他药剂用量(kg/d)", "width": 110 },
                    { "field": "syxtxl", "title": "输油系统效率(%)", "width": 110 },
                    { "field": "yxpj", "title": "运行评价", "width": 110 },
                    // { "field": "zid", "title": "站ID", "width": 250 },
                    { "field": "tszs", "title": "转油放水站数", "width": 110 },
                    { "field": "zjs", "title": "总井数", "width": 110 },
                    { "field": "kjs", "title": "开井数", "width": 110 },
                    // { "field": "allowDelete", "title": "允许删除", "width": 110 },
                    { "field": "ydhsl", "title": "一段含水率(%)", "width": 110 },
                    { "field": "edhsl", "title": "二段含水率(%)", "width": 110 },
                    { "field": "sdhsl", "title": "三段含水率(%)", "width": 110 },
                    { "field": "ydcll", "title": "一段处理量(t/d)", "width": 110 },
                    { "field": "edcll", "title": "二段处理量(t/d)", "width": 110 },
                    { "field": "sdcll", "title": "三段处理量(t/d)", "width": 110 },
                    { "field": "ydfhl", "title": "一段负荷率(%)", "width": 110 },
                    { "field": "edfhl", "title": "二段负荷率(%)", "width": 110 },
                    { "field": "sdfhl", "title": "三段负荷率(%)", "width": 110 },
                    { "field": "ytsjyl", "title": "预脱水剂用量", "width": 110 },
                    { "field": "fxpljyl", "title": "反向破乳剂用量", "width": 110 },
                    { "field": "sggkc", "title": "事故罐库存(t)", "width": 110 },
                    { "field": "cjgkc", "title": "沉降罐库存(t)", "width": 110 },
                    { "field": "bz", "title": "备注", "width": 110 },
                ]]
            });
        });

        function searchPageData() {
            $("#display-data-table").datagrid('load', {
                'stationName': $('#query-stations').combobox('getText') === '全部' ? '' : $('#query-stations').combobox('getText'),
                'startDate': $("#query-startDate-key").datebox('getValue'),
                'endDate': $("#query-startDate-key").datebox('getValue'),
            });
        }

        function exportData() {
            window.open("/dmgc_y_d_tsz_new/exportData?startDate=" +
                $("#query-startDate-key").datebox('getValue') +
                "&endDate=" +
                $("#query-startDate-key").datebox('getValue'));
        }

        function flagColor(val, row, index) {
            return 'background:#FFFACD';
        }

        var editIndex = undefined;
        function endEditing() {//该方法用于关闭上一个焦点的editing状态
            if (editIndex == undefined) {
                return true
            }
            if ($('#display-data-table').datagrid('validateRow', editIndex)) {
                $('#display-data-table').datagrid('endEdit', editIndex);
                editIndex = undefined;
                return true;
            } else {
                return false;
            }
        }

        function onClickCell(index, field, value) {
            if (endEditing()) {
                if (field == "zhdh" || field == "dyohd" || field == "dyohq" || field == "dyehd" || field == "dyehq") {
                    var row = $('#display-data-table').datagrid('getRows')[index];
                    $(this).datagrid('beginEdit', index);
                    var ed = $(this).datagrid('getEditor', { index: index, field: field });
                    $(ed.target).focus();
                }
                editIndex = index;
            }
        }

        //单元格失去焦点执行的方法
        function onAfterEdit(index, row, changes) {
            var updated = $('#display-data-table').datagrid('getChanges', 'updated');
            if (updated.length < 1) {
                editRow = undefined;
                $('#display-data-table').datagrid('unselectAll');
                return;
            } else {
                submitData(index, row, changes);
            }
        }

        //提交数据
        function submitData(index, row, changes) {
            $.ajax({
                type: "get",
                async: false,
                url: "/dmgc_y_d_tsz_new/saveData",
                data: {
                    id: row.eventId,
                    zhdh: row.zhdh,
                    dyohd: row.dyohd,
                    dyohq: row.dyohq,
                    dyehd: row.dyehd,
                    dyehq: row.dyehq,
                }
            })
        }

        function auditData() {
            $.ajax({
                type: "get",
                async: false,
                url: "/dmgc_y_d_tsz_new/auditData",
                data: {
                    "rq": $('#query-startDate-key').datebox('getValue')
                },
                success: function (response) {
                    $('#display-data-table').datagrid('reload');
                }
            })
        }
        function importData() {
            $.ajax({
                type: "get",
                url: "http://11.11.111.226:8099/dmgc_y_d_tsz_new_sync/getA5_Data",
                data: {
                    startTime: $('#query-startDate-key').datebox('getValue'),
                    endTime: $('#query-startDate-key').datebox('getValue'),
                },
                success: function (response) {
                    searchPageData();
                }
            })
        }
    </script>
</body>

</html>
