<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:xunjia="http://www.thymeleaf.org">

<head>
	<div th:replace="framework/include/head::head"></div>
</head>

<body>
	<div class="easyui-layout" fit="true">
		<div data-options="region:'north',height:53" style="padding:10px 8px 10px 8px;overflow:hidden;">
			<input id="query-sbmc-key" class="easyui-textbox"
				data-options="width:240,label:'设备名称：' ,labelAlign:'right',labelWidth:90" />
			<input id="query-sbbh-key" class="easyui-textbox"
				data-options="width:240,label:'设备编号：' ,labelAlign:'right',labelWidth:90" />
			<input id="query-ssz-key" class="easyui-textbox"
				data-options="width:240,label:'所属站：' ,labelAlign:'right',labelWidth:90" />
			<input id="query-startDate-key" class="easyui-datebox" editable="false" value="true"
				data-options="width:240,label:'开始时间：' ,labelAlign:'right',labelWidth:90" />
			<input id="query-endDate-key" class="easyui-datebox" editable="false" value="true"
				data-options="width:240,label:'结束时间：' ,labelAlign:'right',labelWidth:90" />
			<a href="javascript:" onclick="searchPageData();" class="easyui-linkbutton" iconCls="fa fa-search">查询</a>
			<a href="javascript:" onclick="importData();" class="easyui-linkbutton" iconCls="fa fa-cloud-upload">同步数据</a>
			<a href="javascript:" onclick="exportData();" class="easyui-linkbutton"
				iconCls="fa fa-cloud-download">导出</a>
		</div>
		<div data-options="region:'center'">
			<table id="display-data-table"></table>
		</div>
	</div>

	<script th:inline="none">
		$(function () {
			$("#display-data-table").datagrid({
				url: '/dmgc_y_d_zsbyxss/getPageData',
				fit: true,
				fitColumns: false,
				striped: true,
				loadMsg: '数据加载中，请稍候...',
				pagination: true,
				pageSize: 20,
				rownumbers: true,
				queryParams: {
					'sbmc': $("#query-sbmc-key").textbox('getValue'),
					'sbbh': $("#query-sbbh-key").textbox('getValue'),
					'startDate': $("#query-startDate-key").datebox('getValue'),
					'endDate': $("#query-endDate-key").datebox('getValue'),
				},
				columns: [[
					{ "field": "sbid", "title": "设备ID", "width": 110 },
					{ "field": "sbmc", "title": "设备名称", "width": 110 },
					{ "field": "rq", "title": "日期", "width": 110 },
					{ "field": "ssdwdm", "title": "所属单位代码", "width": 110 },
					{ "field": "sszkTableName", "title": "所属站库表名", "width": 110 },
					{ "field": "sszkName", "title": "所属站库名", "width": 110 },
					{ "field": "sblb", "title": "设备类别", "width": 110 },
					{ "field": "sbbh", "title": "设备编号", "width": 110 },
					{ "field": "yxss", "title": "运行时数", "width": 110 },
					{ "field": "sbyxzk", "title": "设备运行状况", "width": 110 },
					{ "field": "bz", "title": "备注", "width": 110 },
					{ "field": "sssbTableName", "title": "所属设备表名", "width": 110 }]]
			});
		});

		function searchPageData() {
			$("#display-data-table").datagrid('load', {
				'sbmc': $("#query-sbmc-key").textbox('getValue'),
				'sbbh': $("#query-sbbh-key").textbox('getValue'),
				'sszkName': $("#query-ssz-key").textbox('getValue'),
				'startDate': $("#query-startDate-key").datebox('getValue'),
				'endDate': $("#query-endDate-key").datebox('getValue'),
			});
		}

		function exportData() {
			window.open("/dmgc_y_d_zsbyxss/exportData?startDate=" +
				$("#query-startDate-key").datebox('getValue') +
				"&endDate=" +
				$("#query-endDate-key").datebox('getValue'));
		}

		function importData() {
			$.ajax({
				type: "get",
				url: "http://11.11.111.226:8099/dmgc_y_d_zsbyxss_sync/getA5_Data",
				data: {
					startTime: $('#query-startDate-key').datebox('getValue'),
					endTime: $('#query-endDate-key').datebox('getValue'),
				},
				success: function (response) {
					searchPageData();
				}
			})
		}
	</script>
</body>

</html>
