<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:bf="http://www.thymeleaf.org">

<head>
    <script type="text/javascript" src="/global/js/echarts/echarts.min.js"></script>
</head>


<div class="table-container">
    <div>
        <div>
            <input id="type-key" type="hidden" name="type">
            <input id="jbId-key" type="hidden" name="jbId">
            <input id="query-startDate-key" class="easyui-datebox" editable="false" value="true"
                   data-options="width:240,label:'开始时间：' ,labelAlign:'right',labelWidth:90" />
            <input id="query-endDate-key" class="easyui-datebox" editable="false" value="true"
                   data-options="width:240,label:'结束时间：' ,labelAlign:'right',labelWidth:90" />
            <a href="javascript:" onclick="searchPageDataLine();" class="easyui-linkbutton" iconCls="fa fa-search">查询</a>
        </div>
    </div>
    <div id='firstLine' style='width:100%;height:450px;float: left;'></div>

</div>

<script th:inline="none">
  function searchPageDataLine() {
    chartLine($('#type-key').val());
  }
  function chartLine(type) {
    var startDate = $("#query-startDate-key").datebox('getValue');
    var endDate = $("#query-endDate-key").datebox('getValue');
    var cycle = '日';
    var jbId =  $("#jbId-key").val();
    if (startDate == "" || endDate == "") {
      $.messager.alert("提示信息", "您未选择要统计的范围。", "warning");
    } else {
      var myChart = echarts.init(document.getElementById('firstLine'));
      $.ajax({
        url: '/dmgc_s_d_zsbrsj/getStatistics',
        data: {
          'startDate': startDate,
          'endDate': endDate,
          'cycle': cycle,
          'type': type,
          'jbId':jbId
        },
        type: 'get',
        dataType: 'json',
        success: function (response) {
          var option = {
            title: {
              x: 'center',
              text: response.title
            },
            tooltip: {
              trigger: 'axis'
            },
            legend: {
              orient: 'vertical',
              x: 'right',
              y: 'center',
              data: response.legend
            },
            grid: {
              left: '3%',
              right: '10%',
              bottom: '3%',
              containLabel: true
            },
            xAxis: {
              type: 'category',
              boundaryGap: false,
              data: response.xaxis
            },
            yAxis: {
              type: 'value'
            },
            series: response.series
          }
          myChart.setOption(option);
        }
      });
    }
  }
</script>

</html>
