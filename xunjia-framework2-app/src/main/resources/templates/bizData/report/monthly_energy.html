<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:bf="http://www.thymeleaf.org">

<head>
  <div th:replace="framework/include/head::head"></div>
  <script type="text/javascript" src="/global/js/echarts/echarts.min.js"></script>
  <script type="text/javascript" src="/global/js/datagrid-export.js"></script>
</head>

<body>
  <div class="easyui-layout" fit="true">
    <div data-options="region:'north',height:53" style="padding:10px 8px 10px 8px;overflow:hidden;">
      <span>统计月份：</span>
      <select class="easyui-combobox" id="query-year" data-options="
                url:'/commonControl/getYears',
                width: 110,
                textField: 'label',
                valueField: 'value',
                editable: false,
            ">
      </select>
      <a>年</a>
      <select class="easyui-combobox" id="query-month" data-options="
                url:'/commonControl/getMonths',
                width: 110,
                textField: 'label',
                valueField: 'value',
                editable: false,
            ">
      </select>
      <a>月</a>
      <a href="javascript:" onclick="searchPageData();" class="easyui-linkbutton" iconCls="fa fa-search">查询</a>
      <a href="javascript:" onclick="recompute();" class="easyui-linkbutton" iconCls="fa fa-search">重新计算</a>
      <a href="javascript:" onclick="chart();" class="easyui-linkbutton" iconCls="fa fa-bar-chart">总耗图表</a>
      <a href="javascript:" onclick="chartUnit();" class="easyui-linkbutton" iconCls="fa fa-bar-chart">单耗图表</a>
      <a href="javascript:" onclick="exportDatagrid();" class="easyui-linkbutton" iconCls="fa fa-cloud-download">导出</a>
    </div>
    <div data-options="region:'center'">
      <table id="display-data-table"></table>
    </div>
  </div>


  <script th:inline="none">
    $(function () {
      let date = new Date;
      date.setMonth(date.getMonth()-1);
      let year = date.getFullYear();
      let month = date.getMonth() + 1;
      $('#query-year').combobox('setValue', year);
      $('#query-month').combobox('setValue', month);
      $("#display-data-table").datagrid({
        url: '/monthlyEnergy/queryReport',
        fit: true,
        fitColumns: false,
        striped: true,
        loadMsg: '数据加载中，请稍候...',
        pagination: false,
        pageSize: 20,
        rownumbers: true,
        onClickCell: onClickCell,
        onAfterEdit: onAfterEdit,
        queryParams: {
          year: year,
          month: month,
          compute: false
        },
        onLoadSuccess: function (data) {
          loadDataGrid(data)
        },
        columns: [
          [
            { field: "areaName", title: "作业区名称", rowspan: 4, width: 100, align: 'center' },
            { title: "耗电量（10⁴kWh)", colspan: 12, align: 'center' },
            { title: "耗气量（10⁴m³）", rowspan: 3, colspan: 2, align: 'center' },
            { title: "能耗量（10⁴tce)", rowspan: 3, colspan: 2, align: 'center' },
            { title: "产液量（10⁴t）", rowspan: 3, colspan: 2, align: 'center' },
            { title: "产油量（10⁴t）", rowspan: 3, colspan: 2, align: 'center' },
            { title: "泵水量（10⁴m³）", rowspan: 3, colspan: 2, align: 'center' },
            { title: "水处理量（10⁴m³）", rowspan: 3, colspan: 2, align: 'center' },
            { title: "单耗", colspan: 10, align: 'center' },
          ],
          [
            { title: "集输系统", colspan: 6, align: 'center' },
            { title: "注水系统", rowspan: 2, colspan: 2, align: 'center' },
            { title: "水处理系统", rowspan: 2, colspan: 2, align: 'center' },
            { title: "供水系统", rowspan: 2, colspan: 2, align: 'center' },
            { title: "集输系统", colspan: 8, align: 'center' },
            { title: "注水系统", colspan: 2, align: 'center' },
          ],
          [
            { title: "站场", colspan: 2, align: 'center' },
            { title: "电加热", colspan: 2, align: 'center' },
            { title: "气系统", colspan: 2, align: 'center' },
            { title: "吨液耗电（kWh/t）", colspan: 2, align: 'center' },
            { title: "吨液耗气（m³/t）", colspan: 2, align: 'center' },
            { title: "吨油耗电（kWh/t）", colspan: 2, align: 'center' },
            { title: "吨油耗气（m³/t）", colspan: 2, align: 'center' },
            { title: "泵水单耗（kWh/m³）", colspan: 2, align: 'center' },
          ],
          [
            { field: "oilStationPower", title: "当月", width: 80, align: 'center' },
            { field: "oilStationPowerSum", title: "累计", width: 80, align: 'center' },
            {
              field: "oilHeatingPower", title: "当月", width: 80, styler: flagColor, editor: {
                type: 'numberbox',
                options: { precision: 2 }
              }, align: 'center'
            },
            { field: "oilHeatingPowerSum", title: "累计", width: 80, align: 'center' },
            {
              field: "oilGasPower", title: "当月", width: 80, styler: flagColor, editor: {
                type: 'numberbox',
                options: { precision: 2 }
              }, align: 'center'
            },
            { field: "oilGasPowerSum", title: "累计", width: 80, align: 'center' },
            { field: "waterInjectPower", title: "当月", width: 80, align: 'center' },
            { field: "waterInjectPowerSum", title: "累计", width: 80, align: 'center' },
            { field: "waterTreatmentPower", title: "当月", width: 80, align: 'center' },
            { field: "waterTreatmentPowerSum", title: "累计", width: 80, align: 'center' },
            {
              field: "waterSupplyPower", title: "当月", width: 80, styler: flagColor, editor: {
                type: 'numberbox',
                options: { precision: 2 }
              }, align: 'center'
            },
            { field: "waterSupplyPowerSum", title: "累计", width: 80, align: 'center' },
            { field: "consumeGas", title: "当月", width: 80, align: 'center' },
            { field: "consumeGasSum", title: "累计", width: 80, align: 'center' },
            { field: "energyConsumption", title: "当月", width: 80, align: 'center' },
            { field: "energyConsumptionSum", title: "累计", width: 80, align: 'center' },
            { field: "liquidProduction", title: "当月", width: 80, align: 'center' },
            { field: "liquidProductionSum", title: "累计", width: 80, align: 'center' },
            { field: "oilProduction", title: "当月", width: 80, align: 'center' },
            { field: "oilProductionSum", title: "累计", width: 80, align: 'center' },
            { field: "pumpingWater", title: "当月", width: 80, align: 'center' },
            { field: "pumpingWaterSum", title: "累计", width: 80, align: 'center' },
            { field: "waterTreatment", title: "当月", width: 80, align: 'center' },
            { field: "waterTreatmentSum", title: "累计", width: 80, align: 'center' },
            { field: "oilPowerUnit", title: "月平均", width: 80, align: 'center' },
            { field: "oilPowerUnitSumAve", title: "累计平均", width: 80, align: 'center' },
            { field: "oilGasUnit", title: "月平均", width: 80, align: 'center' },
            { field: "oilGasUnitSumAve", title: "累计平均", width: 80, align: 'center' },
            { field: "petroleumPowerUnit", title: "月平均", width: 80, align: 'center' },
            { field: "petroleumPowerUnitSumAve", title: "累计平均", width: 80, align: 'center' },
            { field: "petroleumGasUnit", title: "月平均", width: 80, align: 'center' },
            { field: "petroleumGasUnitSumAve", title: "累计平均", width: 80, align: 'center' },
            { field: "waterInjectPumpingUnit", title: "月平均", width: 80, align: 'center' },
            { field: "waterInjectPumpingUnitSumAve", title: "累计平均", width: 80, align: 'center' },
          ]
        ]
      });
    });

    function searchPageData() {
      let year = $('#query-year').combobox('getValue');
      let month = $('#query-month').combobox('getValue');
      $("#display-data-table").datagrid('load', {
        year: year,
        month: month,
        compute: false
      });
    }

    function recompute() {
      let year = $('#query-year').combobox('getValue');
      let month = $('#query-month').combobox('getValue');
      $("#display-data-table").datagrid('load', {
        year: year,
        month: month,
        compute: true
      });
    }

    function flagColor(val, row, index) {
      if (row["areaName"] != "合计") {
        return 'background:#FFFACD';
      }
    }

    var editIndex = undefined;
    function endEditing() {//该方法用于关闭上一个焦点的editing状态
      if (editIndex == undefined) {
        return true
      }
      if ($('#display-data-table').datagrid('validateRow', editIndex)) {
        $('#display-data-table').datagrid('endEdit', editIndex);
        editIndex = undefined;
        return true;
      } else {
        return false;
      }
    }


    function onClickCell(index, field, value) {
      if (endEditing()) {
        if (field == "oilHeatingPower" || field == "oilGasPower" || field == "waterSupplyPower") {
          var row = $('#display-data-table').datagrid('getRows')[index];
          if (row["areaName"] != "合计") {
            $(this).datagrid('beginEdit', index);
            var ed = $(this).datagrid('getEditor', { index: index, field: field });
            $(ed.target).focus();
          }
        }
        editIndex = index;
      }
    }

    //单元格失去焦点执行的方法
    function onAfterEdit(index, row, changes) {
      var updated = $('#display-data-table').datagrid('getChanges', 'updated');
      if (updated.length < 1) {
        editRow = undefined;
        $('#display-data-table').datagrid('unselectAll');
        return;
      } else {
        submitData(index, row, changes);
      }
    }

    //提交数据
    function submitData(index, row, changes) {
      $.ajax({
        type: 'get',
        async: false,
        url: "/monthlyEnergy/update",
        data: {
          id: row.id,
          oilHeatingPower: row.oilHeatingPower,
          oilGasPower: row.oilGasPower,
          waterSupplyPower: row.waterSupplyPower,
        },
        success: function (response) {
          $('#display-data-table').datagrid('reload');
        }
      })
    }

    function loadDataGrid(data) {
      //添加"合计"行
      $("#display-data-table").datagrid(
        'appendRow',
        {
          areaName: "合计",
          oilStationPower: compute("oilStationPower", false),
          oilStationPowerSum: compute("oilStationPowerSum", false),
          oilHeatingPower: compute("oilHeatingPower", false),
          oilHeatingPowerSum: compute("oilHeatingPowerSum", false),
          oilGasPower: compute("oilGasPower", false),
          oilGasPowerSum: compute("oilGasPowerSum", false),
          waterInjectPower: compute("waterInjectPower", false),
          waterInjectPowerSum: compute("waterInjectPowerSum", false),
          waterTreatmentPower: compute("waterTreatmentPower", false),
          waterTreatmentPowerSum: compute("waterTreatmentPowerSum", false),
          waterSupplyPower: compute("waterSupplyPower", false),
          waterSupplyPowerSum: compute("waterSupplyPowerSum", false),
          consumeGas: compute("consumeGas", false),
          consumeGasSum: compute("consumeGasSum", false),
          energyConsumption: compute("energyConsumption", false),
          energyConsumptionSum: compute("energyConsumptionSum", false),
          liquidProduction: compute("liquidProduction", false),
          liquidProductionSum: compute("liquidProductionSum", false),
          oilProduction: compute("oilProduction", false),
          oilProductionSum: compute("oilProductionSum", false),
          pumpingWater: compute("pumpingWater", false),
          pumpingWaterSum: compute("pumpingWaterSum", false),
          waterTreatment: compute("waterTreatment", false),
          waterTreatmentSum: compute("waterTreatmentSum", false),
          oilPowerUnit: compute("oilPowerUnit", true),
          oilPowerUnitSumAve: compute("oilPowerUnitSumAve", true),
          oilGasUnit: compute("oilGasUnit", true),
          oilGasUnitSumAve: compute("oilGasUnitSumAve", true),
          petroleumPowerUnit: compute("oilPowerUnit", true),
          petroleumPowerUnitSumAve: compute("oilPowerUnitSumAve", true),
          petroleumGasUnit: compute("oilGasUnit", true),
          petroleumGasUnitSumAve: compute("oilGasUnitSumAve", true),
          waterInjectPumpingUnit: compute("waterInjectPumpingUnit", true),
          waterInjectPumpingUnitSumAve: compute("waterInjectPumpingUnitSumAve", true),
        });
      $("#display-data-table").datagrid("fixRowHeight");//刷新序号列 避免序号列错位
      // var rows = $("#display-data-table").datagrid("getRows");
      // if (rows.length > 0) {
      //   //循环判断操作为新增的不能选择
      //   for (var i = 0; i < rows.length; i++) {
      //     if (rows[i]["dataSource"] == "合计") {
      //       $("input[type='checkbox']")[i + 1].disabled = true;
      //       $("#indexWatersoilList").datagrid('unselectRow', i);
      //     }
      //   }
      // }
    }

    function compute(colName, ave) {
      let rows = $("#display-data-table").datagrid("getRows");
      let total = 0;
      let count = 0;
      for (var i = 0; i < rows.length; i++) {
        if (rows[i][colName] != null) {
          if (parseFloat(rows[i][colName]) != 0) {
            count++;
          }
          total += parseFloat(rows[i][colName]);
        }
      }
      if (ave && count > 0) {
        total = total / count;
      }
      total = total.toFixed(2);
      return total;
    }

    function chart() {
      var editDialog = $("<div></div>").dialog({
        title: '统计信息',
        width: 1400,
        height: 550,
        modal: true,
        iconCls: "fa fa-pencil-square-o",
        href: '/monthlyEnergy/toChart',
        onClose: function () {
          $(this).dialog('destroy');
        },
        onLoad: function () {
          var myChart = echarts.init(document.getElementById('chart'));
          let year = $('#query-year').combobox('getValue');
          let month = $('#query-month').combobox('getValue');
          $.ajax({
            url: '/monthlyEnergy/getStatistics',
            data: { year: year, month: month },
            type: 'get',
            dataType: 'json',
            success: function (response) {
              var option = {
                title: {
                  x: 'center',
                  text: response.title
                },
                tooltip: {
                  trigger: 'axis'
                },
                legend: {
                  orient: 'vertical',
                  x: 'right',
                  y: 'center',
                  data: response.legend
                },
                grid: {
                  left: '3%',
                  right: '10%',
                  bottom: '3%',
                  containLabel: true
                },
                xAxis: {
                  type: 'category',
                  data: response.xaxis
                },
                yAxis: {
                  type: 'value'
                },
                series: response.series
              }
              myChart.setOption(option);
            }
          });

        },
        buttons: [
          {
            text: '关闭',
            iconCls: 'fa fa-close',
            handler: function () {
              editDialog.dialog('destroy');
            }
          }
        ]
      });
    }

    function chartUnit() {
      var editDialog = $("<div></div>").dialog({
        title: '统计信息',
        width: 1400,
        height: 550,
        modal: true,
        iconCls: "fa fa-pencil-square-o",
        href: '/monthlyEnergy/toChart',
        onClose: function () {
          $(this).dialog('destroy');
        },
        onLoad: function () {
          var myChart = echarts.init(document.getElementById('chart'));
          let year = $('#query-year').combobox('getValue');
          let month = $('#query-month').combobox('getValue');
          $.ajax({
            url: '/monthlyEnergy/getStatisticsUnit',
            data: { year: year, month: month },
            type: 'get',
            dataType: 'json',
            success: function (response) {
              var option = {
                title: {
                  x: 'center',
                  text: response.title
                },
                tooltip: {
                  trigger: 'axis'
                },
                legend: {
                  orient: 'vertical',
                  x: 'right',
                  y: 'center',
                  data: response.legend
                },
                grid: {
                  left: '3%',
                  right: '10%',
                  bottom: '3%',
                  containLabel: true
                },
                xAxis: {
                  type: 'category',
                  data: response.xaxis
                },
                yAxis: {
                  type: 'value'
                },
                series: response.series
              }
              myChart.setOption(option);
            }
          });

        },
        buttons: [
          {
            text: '关闭',
            iconCls: 'fa fa-close',
            handler: function () {
              editDialog.dialog('destroy');
            }
          }
        ]
      });
    }

    function exportDatagrid() {
      let year = $('#query-year').combobox('getValue');
      let month = $('#query-month').combobox('getValue');
      $('#display-data-table').datagrid('toExcel', {
        filename: '能耗月报.xls',
        worksheet: '能耗月报',
        isReport: true,
        mergeLastRow: false,
        caption: "大庆油田第十采油厂" + year + "年" + month + "月能耗月报"
      });
    }

  </script>
</body>

</html>
