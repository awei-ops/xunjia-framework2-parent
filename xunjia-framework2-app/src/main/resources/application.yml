spring:
  application:
    name: pes
  profiles: 
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 1024MB
      max-request-size: 1024MB
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  activiti:
    check-process-definitions: false
    history-level: full
    db-identity-used: false
    #database-schema-update: none

server:
  servlet:
    session:
      cookie:
        name: framework2_app_session
