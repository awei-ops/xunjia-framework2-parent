<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">

<div id="portal" style="padding:10px;">
	<div style="width:75%;">
		<div id="attachment-panel" class="easyui-panel" title="附件" style="width:100%;height:436px;">
			<table id="home-attachment-table"></table>
		</div>
	</div>
	
	<div style="width:25%;">
		<div class="easyui-panel" title="更新日志" style="width:100%;height: 500px; padding:10px;">
			<p style="font-size:14px;font-weight:bold;">当前版本 v2.0.0</p>
			<p>更新日期：2020-08-27</p>
			<p>更新内容：</p>
			<ul>
				<li>1.平台修改为maven多模块开发模式</li>
				<li>2.增加shiro权限验证框架</li>
				<li>3.增加资源管理</li>
				<li>4.增加流程管理模块</li>
				<li>5.增加通用模块（附件管理）</li>
			</ul>
		</div>
	</div>
</div>
<script th:inline="none">
	$(function(){
		
		$("#portal").portal({
			fit: true,
			border: false
		});
		
		$("#home-attachment-table").datagrid({
			url: '/attachment/findAttachments?uid=all',
			idField: 'code',
			border: false,
			fit: true,
			fitColumns: true,
			striped: true,
			loadMsg: '数据加载中，请稍候...',
			pagination: true,
			pageSize: 10,
			columns: [[
				{
					field: 'a',
					title: '序号',
					width: 20,
					align: 'center',
					formatter: function(value, row, index){
						return index + 1;
					}
				}, {
					field: 'title',
					title: '附件名称',
					align: 'center',
					width: 80
				}, {
					field: 'originalFileName',
					title: '文件名',
					align: 'center',
					width: 80
				}, {
					field: 'downloadCount',
					title: '下载次数',
					align: 'center',
					width: 40
				}, {
					field: 'code',
					title: '下载',
					align: 'center',
					width: 40,
					formatter: function(value, row, index){
						return "<a class='datagrid-button' href='javascript:' onclick=\"attaDownload('"+ value +"');\">下载</a>";
					}
				}
			]],
			onLoadSuccess: function(data){
				$(".datagrid-button").linkbutton({iconCls:'fa fa-download'});
			}
		});
	});
	
	function attaDownload(code){
		window.open("/attachment/download?code=" + code);
	}
</script>
</html>
