<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:bf="http://www.thymeleaf.org">
	
<body>
	<script type="text/javascript" src="/global/js/icheck-1.x/icheck.min.js"></script>
	<link type="text/css" rel="stylesheet" href="/global/js/icheck-1.x/skins/square/red.css" />
	<style>
		.prop-table { 
			width: 100%; 
			border: 1px solid #dddddd;
			border-collapse: collapse;
			font-size: 13px; 
			margin-top: 10px;
		}
		.prop-table th {
			background-color: #f4f4f4;
			font-weight: bold;
			height: 34px;
			text-align: center;
		}
		.prop-table td {
			background-color: #ffffff;
			border: 1px solid #dddddd;
			height: 34px;
			padding: 5px;
			text-align: center;
		}
		.prop-title {
			width: 100%;
			border: 1px solid #dddddd;
			margin-top: 10px;
		}
		.prop-title-name {
			text-align: left;
			padding-left: 10px; 
		}
		.prop-table-btn {
			text-align: right;
			padding-right: 10px;
		}
	</style>
	
	<div class="table-container">
		<form id="edit-custom-entity-form" method="post">
			<input type="hidden" name="id" th:value="${entity.id}" />
			<input type="hidden" id="propSize" th:value="${#lists.size(entity.properties)}" />
			<table class="edit-table">
				<tr>
					<td colspan="4" style="padding-left: 10px;">实体类信息</td>
				</tr>
				<tr>
					<th>包名：</th>
					<td>
						<input class="easyui-textbox" id="custom-entity-package-name" name="packageName" th:value="${entity.packageName}" data-options="required:true,width:300" />
					</td>
					<th>实体类名：</th>
					<td>
						<input class="easyui-textbox" id="custom-entity-entity-name" name="entityName" th:value="${entity.entityName}" data-options="required:true,width:300" />
					</td>
				</tr>
				<tr>
					<th>映射表名：</th>
					<td>
						<input class="easyui-textbox" id="custom-entity-table-name" name="tableName" th:value="${entity.tableName}" data-options="required:true,width:300" />
					</td>
					<th>描述：</th>
					<td>
						<input class="easyui-textbox" id="custom-entity-entity-descr" name="entityDescr" th:value="${entity.entityDescr}" data-options="required:true,width:300" />
					</td>
				</tr>
				<tr>
					<th>树结构：</th>
					<td>
						<select id="custom-entity-tree-structure" name="treeStructure" class="easyui-combobox" th:value="${entity.treeStructure}" data-options="width:300,editable:false,panelHeight:'auto',onChange:treeStructureChanged">
							<option value="1" th:selected="${entity.treeStructure == 1}">树形结构</option>
							<option value="0" th:selected="${entity.treeStructure == 0}">非树形结构</option>
						</select>
					</td>
					<th>操作：</th>
					<td>
						<input type="hidden" id="custom-entity-operations-value" th:value="${entity.operations}" />
						<select id="custom-entity-operations" name="operations"></select>
					</td>
				</tr>
				<tr>
					<th>功能描述：</th>
					<td colspan="3">
						<input class="easyui-textbox" id="instruction" name="instruction"
							   data-options="multiline:true,width:700,height:80" th:value="${entity.instruction}" />
					</td>
				</tr>
			</table>
			
			<table class="prop-table" id="prop-table">
				<tr>
					<td colspan="10" style="border:0;text-align:left;padding-left:10px;">属性信息</td>
					<td colspan="10" style="border:0;text-align:right;padding-right:10px;">
						<a class="easyui-linkbutton info" href="javascript:" onclick="addProp();">增加属性</a>
					</td>
				</tr>
				<tr>
					<th>属性名称</th>
					<th>类型</th>
					<th>映射列名</th>
					<th>描述</th>
					<th style="width:50px;">主键</th>
					<th style="width:60px;">启用标识</th>
					<th style="width:65px;">树节点名称</th>
					<th style="width:50px;">唯一</th>
					<th style="width:50px;">必需</th>
					<th style="width:50px;">可查询</th>
					<th style="width:60px;">列表显示</th>
					<th>查询条件</th>
					<th>控件</th>
					<th style="width:60px;">读取字典</th>
					<th>字典分类编码</th>
					<th>获取方式</th>
					<th>被映射属性</th>
					<th>查询排序</th>
					<th>显示顺序</th>
					<th style="width:50px;">操作</th>
				</tr>
				<tr id="props-0">
					<td><input class="easyui-textbox" name="properties[0].propName" data-options="required:true" th:value="${entity.properties[0].propName}" /></td>
					<td><input class="easyui-textbox" name="properties[0].type" value="String" readonly /></td>
					<td><input class="easyui-textbox" name="properties[0].columnName" th:value="${entity.properties[0].columnName}" /></td>
					<td><input class="easyui-textbox" name="properties[0].propDescr" th:value="${entity.properties[0].propDescr}" data-options="required:true,width:100" /></td>
					<td><input type="radio" name="properties[0].pkFlag" value="1" checked /></td>
					<td><input type="hidden" name="properties[0].enableFlag" value="0" /></td>
					<td><input type="hidden" name="properties[0].treeNodeFlag" value="0" /></td>
					<td><input type="radio" name="properties[0].uniqueFlag" value="1" checked /></td>
					<td><input type="hidden" name="properties[0].requiredFlag" value="1" /></td>
					<td><input type="hidden" name="properties[0].searchFlag" value="0" /></td>
					<td><input type="hidden" name="properties[0].tableColumnFlag" value="0" /></td>
					<td><input type="hidden" name="properties[0].searchCond" value="" /></td>
					<td><input type="hidden" name="properties[0].controlType" value="" /></td>
					<td><input type="hidden" name="properties[0].dicFlag" value="0" /></td>
					<td><input type="hidden" name="properties[0].dicTypeCode" value="" /></td>
					<td><input type="hidden" name="properties[0].fetchType" value="" /></td>
					<td><input type="hidden" name="properties[0].mappedProp" value="" /></td>
					<td><input type="hidden" name="properties[0].orderBy" value="" /></td>
					<td><input class="easyui-numberbox" name="properties[0].orderNo" data-options="value:1,min:1,precision:0,width:50" /></td>
					<td></td>
				</tr>
				<div th:each="p,pStat:${entity.properties}" th:if="${pStat.index > 0 && p.enableFlag == 0}" th:remove="tag">
					<div th:if="${entity.treeStructure eq 0 or (entity.treeStructure eq 1 and p.propName ne 'parent' and p.propName ne 'name')}">
						<tr th:id="${'props-' + pStat.index}">
					</div>
					<div th:if="${entity.treeStructure eq 1 and p.propName ne 'parent'}">
						<tr id="props-parent">
					</div>
					<div th:if="${entity.treeStructure eq 1 and p.propName ne 'name'}">
						<tr id="props-name">
					</div>
						<!-- 带树形结构的情况，parent属性的treeNodeFlag显示radio，非parent属性hidden -->
						<div th:if="${entity.treeStructure eq 1 and p.propName eq 'parent'}" th:remove="tag">
							<td><input class="easyui-textbox" th:name="${'properties[' + pStat.index + '].propName'}" th:value="${p.propName}" data-options="required:true,editable:false" /></td>
							<td><input class="easyui-textbox" th:name="${'properties[' + pStat.index + '].type'}" th:value="${p.type}" data-options="editable:false,required:true" /></td>
							<td><input class="easyui-textbox" th:name="${'properties[' + pStat.index + '].columnName'}" th:value="${p.columnName}" data-options="editable:false" /></td>
							<td><input class="easyui-textbox" th:name="${'properties[' + pStat.index + '].propDescr'}" th:value="${p.propDescr}" data-options="required:true,width:100,editable:false" /></td>
							<td><input type="hidden" th:name="${'properties[' + pStat.index + '].pkFlag'}" value="0" /></td>
							<td><input type="hidden" th:name="${'properties[' + pStat.index + '].enableFlag'}" value="0" /></td>
							<td><input type="hidden" th:name="${'properties[' + pStat.index + '].treeNodeFlag'}" value="0" /></td>
							<td><input type="hidden" th:name="${'properties[' + pStat.index + '].uniqueFlag'}" value="0" /></td>
							<td><input type="hidden" th:name="${'properties[' + pStat.index + '].requiredFlag'}" value="0" /></td>
							<td><input type="hidden" th:name="${'properties[' + pStat.index + '].searchFlag'}" value="0" /></td>
						</div>
						<div th:if="${entity.treeStructure eq 1 and p.propName eq 'name'}" th:remove="tag">
							<td><input class="easyui-textbox" th:name="${'properties[' + pStat.index + '].propName'}" th:value="${p.propName}" data-options="required:true,editable:false" /></td>
							<td><input class="easyui-textbox" th:name="${'properties[' + pStat.index + '].type'}" th:value="${p.type}" data-options="editable:false,required:true" /></td>
							<td><input class="easyui-textbox" th:name="${'properties[' + pStat.index + '].columnName'}" th:value="${p.columnName}" data-options="" /></td>
							<td><input class="easyui-textbox" th:name="${'properties[' + pStat.index + '].propDescr'}" th:value="${p.propDescr}" data-options="required:true,width:100" /></td>
							<td><input type="hidden" th:name="${'properties[' + pStat.index + '].pkFlag'}" value="0" /></td>
							<td><input type="hidden" th:name="${'properties[' + pStat.index + '].enableFlag'}" value="0" /></td>
							<td><input type="radio" th:name="${'properties[' + pStat.index + '].treeNodeFlag'}" value="1" checked /></td>
							<td><input type="checkbox" th:name="${'properties[' + pStat.index + '].uniqueFlag'}" value="1" th:checked="${p.uniqueFlag == 1} ? true : false" /></td>
							<td><input type="checkbox" th:name="${'properties[' + pStat.index + '].requiredFlag'}" value="1" th:checked="${p.requiredFlag == 1} ? true : false" /></td>
							<td><input type="checkbox" th:name="${'properties[' + pStat.index + '].searchFlag'}" value="1" th:checked="${p.searchFlag == 1} ? true : false" /></td>
						</div>
						<div th:if="${(entity.treeStructure eq 1 and p.propName ne 'parent' and p.propName ne 'name') or entity.treeStructure eq 0}" th:remove="tag">
							<td><input class="easyui-textbox" th:name="${'properties[' + pStat.index + '].propName'}" th:value="${p.propName}" data-options="required:true,editable:false" /></td>
							<td><input class="easyui-combobox" th:name="${'properties[' + pStat.index + '].type'}" th:value="${p.type}" data-options="url:'/customEntity/findDataTypes',editable:false,required:true,textField:'name',valueField:'value'" /></td>
							<td><input class="easyui-textbox" th:name="${'properties[' + pStat.index + '].columnName'}" th:value="${p.columnName}" data-options="" /></td>
							<td><input class="easyui-textbox" th:name="${'properties[' + pStat.index + '].propDescr'}" th:value="${p.propDescr}" data-options="required:true,width:100" /></td>
							<td><input type="hidden" th:name="${'properties[' + pStat.index + '].pkFlag'}" value="0" /></td>
							<td><input type="hidden" th:name="${'properties[' + pStat.index + '].enableFlag'}" value="0" /></td>
							<td><input type="hidden" th:name="${'properties[' + pStat.index + '].treeNodeFlag'}" value="0" /></td>
							<td><input type="checkbox" th:name="${'properties[' + pStat.index + '].uniqueFlag'}" value="1" th:checked="${p.uniqueFlag == 1} ? true : false" /></td>
							<td><input type="checkbox" th:name="${'properties[' + pStat.index + '].requiredFlag'}" value="1" th:checked="${p.requiredFlag == 1} ? true : false" /></td>
							<td><input type="checkbox" th:name="${'properties[' + pStat.index + '].searchFlag'}" value="1" th:checked="${p.searchFlag == 1} ? true : false" /></td>
						</div>

						<td><input type="checkbox" th:name="${'properties[' + pStat.index + '].tableColumnFlag'}" value="1" th:checked="${p.tableColumnFlag == 1} ? true : false" /></td>
						<td><input class="easyui-combobox" th:name="${'properties[' + pStat.index + '].searchCond'}" th:value="${p.searchCond}" data-options="url:'/dicContent/findByTypeCode?typeCode=SEARCH_CONDITION',editable:false,textField:'name',valueField:'name',width:100" /></td>
						<td><input class="easyui-combobox" th:name="${'properties[' + pStat.index + '].controlType'}" th:value="${p.controlType}" data-options="url:'/dicContent/findByTypeCode?typeCode=CONTROL_TYPE',editable:false,required:true,textField:'name',valueField:'name',width:100" /></td>
						<td><input type="checkbox" th:id="${'dicFlag-' + pStat.index}" th:name="${'properties[' + pStat.index + '].dicFlag'}" th:checked="${p.dicFlag == 1} ? true : false" value="1" /></td>
						<td><input class="easyui-textbox" th:id="${'dicTypeCode-' + pStat.index}" th:name="${'properties[' + pStat.index + '].dicTypeCode'}" th:value="${p.dicTypeCode}" th:disabled="${p.dicFlag == 0} ? true : false" data-options="width:100" /></td>
						<td>
							<select class="easyui-combobox" th:name="${'properties[' + pStat.index + '].fetchType'}" data-options="width:60,panelHeight:'auto',editable:false">
								<option value="" th:selected="${#strings.isEmpty(p.fetchType)}">选择</option>
								<option value="EAGER" th:selected="${p.fetchType} eq 'EAGER'">EAGER</option>
								<option value="LAZY" th:selected="${p.fetchType} eq 'LAZY'">LAZY</option>
							</select>
						</td>
						<td><input class="easyui-textbox" th:name="${'properties[' + pStat.index + '].mappedProp'}" th:value="${p.mappedProp}" data-options="width:100" /></td>
						<td>
							<select class="easyui-combobox" th:name="${'properties[' + pStat.index + '].orderBy'}" th:value="${p.orderBy}" data-options="width:60,editable:false,panelHeight:'auto'">
								<option value="" th:selected="${#strings.isEmpty(p.orderBy)}">选择</option>
								<option value="ASC" th:selected="${p.orderBy} eq 'ASC'">ASC</option>
								<option value="DESC" th:selected="${p.orderBy} eq 'DESC'">DESC</option>
							</select>
						</td>
						<td><input class="easyui-numberbox" th:name="${'properties[' + pStat.index + '].orderNo'}" th:value="${p.orderNo}" data-options="min:1,precision:0,width:50" /></td>
						<td><a class="easyui-linkbutton error" href="javascript:" th:onclick="removeProp([[${pStat.index}]]);">×</a></td>
					</tr>
				</div>

				<tr th:each="p,pStat:${entity.properties}" th:if="${pStat.index > 0 && p.enableFlag == 1}" id="props-enable-state">
					<td><input class="easyui-textbox" th:name="${'properties[' + pStat.index + '].propName'}" th:value="${p.propName}" data-options="required:true,editable:false" /></td>
					<td><input class="easyui-textbox" th:name="${'properties[' + pStat.index + '].type'}" th:value="${p.type}" data-options="editable:false,required:true" /></td>
					<td><input class="easyui-textbox" th:name="${'properties[' + pStat.index + '].columnName'}" th:value="${p.columnName}" /></td>
					<td><input class="easyui-textbox" th:name="${'properties[' + pStat.index + '].propDescr'}" th:value="${p.propDescr}" data-options="required:true,width:100,editable:false" /></td>
					<td><input type="hidden" th:name="${'properties[' + pStat.index + '].pkFlag'}" value="0" /></td>
					<td><input type="radio" th:name="${'properties[' + pStat.index + '].enableFlag'}" value="1" checked="checked" /></td>
					<td><input type="hidden" th:name="${'properties[' + pStat.index + '].treeNodeFlag'}" value="0" /></td>
					<td><input type="hidden" th:name="${'properties[' + pStat.index + '].uniqueFlag'}" value="0" /></td>
					<td><input type="hidden" th:name="${'properties[' + pStat.index + '].requiredFlag'}" value="0" /></td>
					<td><input type="checkbox" th:name="${'properties[' + pStat.index + '].searchFlag'}" value="1" th:checked="${p.searchFlag == 1} ? true : false" /></td>
					<td><input type="checkbox" th:name="${'properties[' + pStat.index + '].tableColumnFlag'}" value="1" th:checked="${p.tableColumnFlag == 1} ? true : false" /></td>
					<td><input type="hidden" th:name="${'properties[' + pStat.index + '].searchCond'}" th:value="${p.searchCond}" /></td>
					<td><input type="hidden" th:name="${'properties[' + pStat.index + '].controlType'}" th:value="${p.controlType}" /></td>
					<td><input type="hidden" th:name="${'properties[' + pStat.index + '].dicFlag'}" value="0" /></td>
					<td><input type="hidden" th:name="${'properties[' + pStat.index + '].dicTypeCode'}" value="" /></td>
					<td><input type="hidden" th:name="${'properties[' + pStat.index + '].fetchType'}" value="" /></td>
					<td><input type="hidden" th:name="${'properties[' + pStat.index + '].mappedProp'}" value="" /></td>
					<td><input type="hidden" th:name="${'properties[' + pStat.index + '].orderBy'}" value="" /></td>
					<td><input class="easyui-numberbox" th:name="${'properties[' + pStat.index + '].orderNo'}" th:value="${p.orderNo}" data-options="min:1,precision:0,width:50" /></td>
					<td><a class="easyui-linkbutton error" href="javascript:" th:onclick="removeProp([[${pStat.index}]]);">×</a></td>
				</tr>
			</table>
		</form>
	</div>
	
	<script>
		var operationInited = false;
		var rowIndex = parseInt($("#propSize").val());
		$(function(){
			$("#custom-entity-operations").combobox({
				url: '/dicContent/findByTypeCode?typeCode=BUSINESS_OPERATION',
				editable: false,
				width:300,
				textField: 'name',
				valueField: 'name',
				multiple: true,
				onChange: operationChanged
			});
			$("#custom-entity-operations").combobox('setValues', $("#custom-entity-operations-value").val().split(","));
			initControllers();
		});
		
		function initControllers(){
			$("#prop-table").find(":radio").iCheck({
			    radioClass: 'iradio_square-red',
			    increaseArea: '20%'
			});
			$("#prop-table").find(":checkbox").iCheck({
				checkboxClass: 'icheckbox_square-red',
			    increaseArea: '20%'
			});
			
			$("[name$='dicFlag']").on('ifChanged', function(event){
				var id = event.target.id;
				var index = id.split("-")[1];
				var checked = event.target.checked;
				if (checked){
					$("#dicTypeCode-" + index).textbox("enable");
				} else {
					$("#dicTypeCode-" + index).textbox("disable");
				}
			});
			
			$("[name$='enableFlag']").on('ifChanged', function(event){
				var checked = event.target.checked;
				var enableCheckboxs = $("[name$='enableFlag']");
				if (checked){
					$.each(enableCheckboxs, function(i, n){
						if(n.type == 'checkbox' && n.name != event.target.name){
							$(n).iCheck('uncheck');
						}
					});
				}
			});
			
			$("[name$='treeNodeFlag']").on('ifChanged', function(event){
				var checked = event.target.checked;
				var enableCheckboxs = $("[name$='enableFlag']");
				if (checked){
					$.each(enableCheckboxs, function(i, n){
						if(n.type == 'checkbox' && n.name != event.target.name){
							$(n).iCheck('uncheck');
						}
					});
				}
			});
		}
		
		function addProp(){
			rowIndex = parseInt($("#propSize").val());
			var rowCode = "<tr id=\"props-"+ rowIndex +"\">"
				+ "<td><input class=\"easyui-textbox\" name=\"properties["+ rowIndex +"].propName\" data-options=\"required:true\" /></td>"
				+ "<td><input class=\"easyui-combobox\" name=\"properties["+ rowIndex +"].type\" data-options=\"url:'/customEntity/findDataTypes',editable:false,required:true,textField:'name',valueField:'value'\" /></td>"
				+ "<td><input class=\"easyui-textbox\" name=\"properties["+ rowIndex +"].columnName\" /></td>"
				+ "<td><input class=\"easyui-textbox\" name=\"properties["+ rowIndex +"].propDescr\" data-options=\"required:true,width:100\" /></td>"
				+ "<td><input type=\"hidden\" name=\"properties["+ rowIndex +"].pkFlag\" value=\"0\" /></td>"
				+ "<td><input type=\"hidden\" name=\"properties["+ rowIndex +"].enableFlag\" value=\"0\" /></td>"
				+ "<td><input type=\"hidden\" name=\"properties["+ rowIndex +"].treeNodeFlag\" value=\"0\" /></td>"
				+ "<td><input type=\"checkbox\" name=\"properties["+ rowIndex +"].uniqueFlag\" value=\"1\" /></td>"
				+ "<td><input type=\"checkbox\" name=\"properties["+ rowIndex +"].requiredFlag\" value=\"1\" /></td>"
				+ "<td><input type=\"checkbox\" name=\"properties["+ rowIndex +"].searchFlag\" value=\"1\" /></td>"
				+ "<td><input type=\"checkbox\" name=\"properties["+ rowIndex +"].tableColumnFlag\" value=\"1\" /></td>"
				+ "<td><input class=\"easyui-combobox\" name=\"properties["+ rowIndex +"].searchCond\" data-options=\"url:'/dicContent/findByTypeCode?typeCode=SEARCH_CONDITION',editable:false,textField:'name',valueField:'name',width:100 \" /></td>"
				+ "<td><input class=\"easyui-combobox\" name=\"properties["+ rowIndex +"].controlType\" data-options=\"url:'/dicContent/findByTypeCode?typeCode=CONTROL_TYPE',editable:false,required:true,textField:'name',valueField:'name',width:100 \" /></td>"
				+ "<td><input type=\"checkbox\" id=\"dicFlag-"+ rowIndex +"\" name=\"properties["+ rowIndex +"].dicFlag\" value=\"1\" /></td>"
				+ "<td><input class=\"easyui-textbox\" id=\"dicTypeCode-"+ rowIndex +"\" name=\"properties["+ rowIndex +"].dicTypeCode\" data-options=\"width:100\" disabled /></td>"
				+ "<td>"
				+ "    <select class=\"easyui-combobox\" name=\"properties["+ rowIndex +"].fetchType\" data-options=\"width:60,panelHeight:'auto',editable:false\" >"
				+ "        <option value='' selected>选择</option>"
				+ "        <option value='EAGER'>EAGER</option>"
				+ "        <option value='LAZY'>LAZY</option>"
				+ "    </select>"
				+ "</td>"
				+ "<td><input class=\"easyui-textbox\" name=\"properties["+ rowIndex +"].mappedProp\" data-options=\"width:100\" /></td>"
				+ "<td>"
				+ "    <select class=\"easyui-combobox\" name=\"properties["+ rowIndex +"].orderBy\" data-options=\"width:60,editable:false,panelHeight:'auto'\">"
				+ "        <option value=\"\" selected>选择</option>"
				+ "        <option value=\"ASC\">ASC</option>"
				+ "        <option value=\"DESC\">DESC</option>"
				+ "    </select>"
				+ "</td>"
				+ "<td><input class=\"easyui-numberbox\" name=\"properties["+ rowIndex +"].orderNo\" data-options=\"value:"+ (rowIndex + 1) +",min:1,precision:0,width:50\" /></td>"
				+ "<td><a class=\"easyui-linkbutton error\" href=\"javascript:\" onclick=\"removeProp("+ rowIndex +");\">×</a></td>"
				+ "</tr>";
			$("#prop-table").append(rowCode);
			$.parser.parse('#props-' + rowIndex);
			initControllers();
			$("#propSize").val(rowIndex + 1);
		}

		function removeProp(index){
			$.messager.confirm('删除确认', '您确认要删除该行数据吗？', function(r){
				if (r){
					$("#props-" + index).fadeOut("slow", function(){
						$("#props-" + index).remove();
					})
				}
			});
		}
		
		function resetControllerIndex(){
			var controlIndex = 0;
			for (var i = 0; i < rowIndex; i++){
				var controls = $("[name^='properties["+ i +"]']");
				if (controls == null || controls.length == 0){
					continue;
				}

				$.each(controls, function(k, n){
					var name = $(n).attr("name");
					name = name.replace(/\[\d\]/g, "["+ controlIndex +"]");
					$(n).attr("name", name);
				});
				controlIndex++;
			}
			$.parser.parse("#prop-table");
		}
		
		function treeStructureChanged(newValue, oldValue){
			if (newValue == "1"){
				var propNames = $("[name$='propName']");
				var parentFlag = false;
				var nameFlag = false;
				for (var i = 0; i < propNames.length; i++){
					if (propNames[i].value == "name"){
						nameFlag = true;
					} else if (propNames[i].value == "parent"){
						parentFlag = true;
					}
				}
				if (!nameFlag){
					addNameProp();
				}
				if (!parentFlag){
					addParentProp();
				} else {
					$.messager.alert("提示信息", "无法添加parent属性，请删除或重命名已存在的parent属性。", "error");
					$("#custom-entity-tree-structure").combobox('setValue', '0');
					return;
				}
			} else {
				removeParentProp();
				removeNameProp();
			}
		}

		function operationChanged(newValue, oldValue){
			if (operationInited){
				var operations = $("#custom-entity-operations").combobox('getValues');
				var enableStateRow = $("#props-enable-state");
				if (operations.indexOf("启用") != -1 || operations.indexOf("禁用") != -1){
					//选择启用、禁用操作，如果state行不存在，则创建该行
					if (enableStateRow == null || enableStateRow.length == 0){
						addEnableStateProp();
					}
				} else {
					if (enableStateRow != null && enableStateRow.length > 0){
						removeEnableStateProp();
					}
				}
			} else {
				operationInited = true;
			}
		}
