<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:bf="http://www.thymeleaf.org">
	
<head>
	<div th:replace="framework/include/head::head"></div>
</head>

<body>
	<div class="easyui-layout" fit="true">
		<div data-options="region:'north',height:53" style="padding:10px 8px 10px 8px;overflow:hidden;">
			<input id="start-date" class="easyui-datebox" data-options="width:210,editable:false,label:'起始日期：' ,labelAlign:'right',labelWidth:80" />
			<input id="end-date" class="easyui-datebox" data-options="width:210,editable:false,label:'截止日期：' ,labelAlign:'right',labelWidth:80" />
			<input id="module" class="easyui-textbox" data-options="width:210,label:'模块名称：' ,labelAlign:'right',labelWidth:80" />
			<input id="username" class="easyui-textbox" data-options="width:210,label:'操作人：' ,labelAlign:'right',labelWidth:80" />
			<a href="javascript:" onclick="searchLoggingEvent();" class="easyui-linkbutton info" iconCls="fa fa-search">查询</a>
		</div>
		<div data-options="region:'center'">
			<table id="logging-event-table"></table>
		</div>
	</div>

	<script th:inline="none">
	var tableData = null;
	$(function(){
		$("#logging-event-table").datagrid({
			url: '/operateLogs/findOperateLogs',
			idField: 'id',
			fit: true,
			fitColumns: true,
			striped: true,
			loadMsg: '数据加载中，请稍候...',
			pagination: true,
			pageSize: 20,
			rownumbers: true,
			method: 'get',
			columns: [[
				{
					field: 'module',
					title: '模块名称',
					width: 100
				}, {
					field: 'description',
					title: '操作描述',
					width: 200
				}, {
					field: 'username',
					title: '操作人账号',
					width: 80
				}, {
					field: 'realName',
					title: '操作人姓名',
					width: 80
				}, {
					field: 'operateTime',
					title: '操作时间',
					width: 80,
				}, {
					field: 'ip',
					title: '操作人ip',
					width: 80,
				}, {
					field: 'a',
					title: '操作',
					width: 50,
					formatter: function(value, row, index){
						return "<a name='viewBtn' class='info' onclick=\"viewLog('" + row.id + "');\" style='height:30px;'></a>";
					}
				}
			]],
			onLoadSuccess: function (data) {
				tableData = data;
				$("a[name='viewBtn']").linkbutton({text: '&nbsp;查&emsp;看&nbsp;', plain: true});
			}
		});
	});
	
	function searchLoggingEvent(){
		var startDate = $("#start-date").datebox('getValue');
		var endDate = $("#end-date").datebox('getValue');
		$("#logging-event-table").datagrid('load', {
			startDate: startDate,
			endDate: endDate,
			module: $("#module").textbox('getValue'),
			username: $('#username').textbox('getValue')
		});
	}
	
	function viewLog(id){
		var operateLog = null;
		$.each(tableData.rows, function(i, n){
			if (n.id == id){
				operateLog = n;
				return;
			}
		});

		var viewDialog = $("<div></div>").dialog({
			title: '查看操作日志',
			width: 800,
			height: 750,
			modal: true,
			iconCls: "fa fa-pencil-square-o",
			href: '/operateLogs/toView',
			onLoad: function(){
				//$.get('/operateLogs/findById?id=' + id, function(operateLog){
					$("#td_module").html(operateLog.module);
					$("#td_description").html(operateLog.description);
					$("#td_username").html(operateLog.username);
					$("#td_realName").html(operateLog.realName);
					$("#td_ip").html(operateLog.ip);
					$("#td_params").html(operateLog.params);
					$("#td_operateTime").html(operateLog.operateTime);
				//});
			},
			onClose : function() {
                $(this).dialog('destroy');
            },
			buttons: [
				{
					text: '关闭',
					iconCls: 'fa fa-close',
					handler: function() {
						viewDialog.dialog('destroy');
					}
				}
			]
		});
	}
	</script>
</body>
</html>
